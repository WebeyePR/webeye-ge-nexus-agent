[project]
name = "ge-nexus-agent"
version = "1.0.0"
description = "WebEye Nexus Agent for Gemini Enterprise - Corporate Agent based on Google ADK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ADK 2.x 全面升级（2026-10-26，依据 docs/ADK2全面升级调研与方案.md）
    # google-genai 约束链：adk 2.13 要求 >=2.30,<3；aiplatform 2.6 要求 <3,>=1.66 —— 取交集精确固定
    "google-adk==2.13.0",
    # 精确锁定：云端构建必须与本地一致（官方最佳实践），且部署模板行为依赖该版本
    # 变更前请先 diff vertexai/agent_engines/templates/adk.py 与
    # nexus_agent/deployement/streaming_app.py（详见 docs/非流式与慢问题解决方案.md）
    "google-cloud-aiplatform==2.6.0",
    "cloudpickle==3.1.2",
    "google-genai==2.33.0",
    "langchain_google_vertexai==3.2.5",
    "langgraph==1.2.17",
    "requests>=2.32.4",
    "python-dotenv>=1.2.1",
    "Pillow>=10.3.0",
    "markdown>=3.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexus_agent*"]

[tool.setuptools.package-data]
# 声明打包包含的非 py 资源文件，确保部署及发布后的 wheel 包中包含必要的执行器与命令注册表。
# 早期关于上传超时的疑虑已在最新的 deploy 脚本超时机制中完美解决，此处需完整打包以保证自省功能高可用。
nexus_agent = [
    "bin/lark-cli",
    "bin/gws",
    "gws_registry/commands.json",
    "lark_registry/commands.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

